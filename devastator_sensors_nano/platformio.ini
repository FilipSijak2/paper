[env:nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; micro-ROS dependency (header + transport). For Humble you typically include library manually.
; If using micro_ros_arduino via PlatformIO: specify lib_deps when available; else vendor manually.
lib_deps =
  adafruit/Adafruit LSM6DS @ ^3.0.3
  adafruit/Adafruit BusIO @ ^1.16.1

build_flags = 
  -D CORE_DEBUG_LEVEL=0
  -D MICROROS_TRANSPORT_SERIAL
  -D RMW_UXRCE_MAX_NODES=1
  -D RMW_UXRCE_MAX_PUBLISHERS=4
  -D RMW_UXRCE_MAX_SUBSCRIPTIONS=1
  -D RMW_UXRCE_MAX_SERVICES=0
  -D RMW_UXRCE_MAX_CLIENTS=0
  -D RMW_UXRCE_MAX_HISTORY=1

; Adjust heap if needed
board_build.partitions = default.csv
