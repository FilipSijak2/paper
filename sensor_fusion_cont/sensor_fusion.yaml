# Configuration used when `SF_IMU_SOURCE=arduino`.
# In the current implementation, Arduino/Nano IMU data already arrives in ROS
# through `robot_bridge` on `/imu/arduino`. The listener in Arduino mode now
# relays that ROS topic to `imu/data_raw` and publishes diagnostics.
#
# In the default `realsense` mode the container runs a Madgwick filter over the
# camera IMU and publishes the filtered result on `/imu/data`.

source:
  topic: /imu/arduino

imu:
  frame_id: imu_link
  publish_rate_hz: 30.0
  covariance_orientation: [0.0025, 0, 0, 0, 0.0025, 0, 0, 0, 0.0025]
  covariance_angular_velocity: [0.01, 0, 0, 0, 0.01, 0, 0, 0, 0.01]
  covariance_linear_acceleration: [0.04, 0, 0, 0, 0.04, 0, 0, 0, 0.04]

logging:
  level: INFO

# The Arduino listener no longer opens `/dev/ttyACM0` directly in Arduino mode.
# This avoids conflicting serial access with `robot_bridge`, which already owns
# the custom binary protocol connection to the Nano.
