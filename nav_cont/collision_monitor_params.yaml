# Active Nav2 Collision Monitor configuration for muxed manual/auto cmd_vel.
#
# Command chain:
#   Nav2 /cmd_vel_auto or teleop /cmd_vel_joy
#     -> cmd_vel_mux
#     -> /cmd_vel_collision_in
#     -> collision_monitor
#     -> robot_bridge /cmd_vel
#
# The monitor uses /scan_filtered for slowdown and predictive footprint checks.
# Directional hard stops are applied by cmd_vel_safety_filter after this node.
# Nav2 also uses local/global costmaps with static map, LaserScan, RealSense
# pointcloud, AI obstacle pointcloud, footprint critics, and inflation.

collision_monitor:
  ros__parameters:
    enabled: true
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"

    cmd_vel_in_topic: "/cmd_vel_collision_in"
    cmd_vel_out_topic: "/cmd_vel"
    state_topic: "/collision_monitor_state"

    # Latest bags showed intermittent scan->base_link future extrapolation
    # around recovery turns. Keep the monitor active, but allow modest TF lag.
    transform_tolerance: 0.5
    source_timeout: 0.7
    base_shift_correction: true
    stop_pub_timeout: 1.0
    enable_stamped_cmd_vel: false
    use_realtime_priority: false

    # Fixed stop polygons are not direction-aware: a front obstacle would also
    # suppress a safe reverse recovery and deadlock the robot. Directional hard
    # stops are enforced after this node by cmd_vel_safety_filter (front only
    # while moving forward, rear only while reversing). Keep predictive
    # footprint collision checking active for every command.
    polygons: ["front_slow", "footprint_approach"]

    front_stop:
      type: "polygon"
      # Reference tuning geometry. Not in the active polygons list;
      # cmd_vel_safety_filter owns the directional hard stop.
      # Keep the hard stop centered in front of the robot. The 2026-06-24
      # hallway bag showed diagonal wall returns at the old +/-0.14 m edges,
      # which held the monitor in stop and prevented reverse recovery.
      points: [0.24, 0.10, 0.24, -0.10, 0.08, -0.10, 0.08, 0.10]
      action_type: "stop"
      max_points: 4
      visualize: true
      polygon_pub_topic: "/collision_monitor/front_stop"
      enabled: true

    front_slow:
      type: "polygon"
      # Narrower than before so normal hallway walls do not constantly toggle
      # the slowdown state. Directional prediction is still handled by the
      # footprint_approach polygon below.
      points: [0.42, 0.16, 0.42, -0.16, 0.12, -0.16, 0.12, 0.16]
      action_type: "slowdown"
      # Keep a warning zone, but do not starve in-place rotations of torque.
      # With 0.55 the 2026-06-21 180-degree turn bags were reduced to ~0.13
      # rad/s and the drivetrain stalled.
      slowdown_ratio: 0.90
      # Require a small cluster before slowdown so scan speckles do not keep
      # toggling velocity while Nav2 is trying to finish a goal.
      max_points: 12
      visualize: true
      polygon_pub_topic: "/collision_monitor/front_slow"
      enabled: true

    rear_stop:
      type: "polygon"
      # Reference tuning geometry. Directional rear stop is enforced by
      # cmd_vel_safety_filter only while the commanded motion is reverse.
      points: [-0.08, 0.15, -0.08, -0.15, -0.26, -0.15, -0.26, 0.15]
      action_type: "stop"
      max_points: 1
      visualize: true
      polygon_pub_topic: "/collision_monitor/rear_stop"
      enabled: true

    footprint_approach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      # At the current slow speeds, 1.0 s prediction is enough and avoids
      # over-conservative braking while backing away from a front obstacle.
      time_before_collision: 1.0
      simulation_time_step: 0.05
      max_points: 5
      visualize: false
      enabled: true

    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan_filtered"
      source_timeout: 0.6
      enabled: true
