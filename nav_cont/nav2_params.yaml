# Nav2 navigation stack configuration optimized for indoor robot

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.12
    alpha2: 0.12
    alpha3: 0.12
    alpha4: 0.12
    alpha5: 0.12
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: true
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 1.5
    laser_max_range: 10.0
    laser_min_range: 0.2
    laser_model_type: "likelihood_field"
    # Keep AMCL lighter on the Pi. The 2026-06-21 22:17 bag showed Nav2/TF
    # timing misses while navigating; fewer beams/particles reduce CPU pressure
    # without removing laser-based localization.
    max_beams: 80
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.12
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.08
    update_min_d: 0.05
    z_hit: 0.75
    z_max: 0.05
    z_rand: 0.20
    z_short: 0.05
    scan_topic: /scan_filtered
    map_topic: map
    set_initial_pose: false
    initial_pose:
      x: 0.026
      y: -0.127
      z: 0.0
      yaw: 3.093 # ~177 deg; measured via /initialpose echo on 2026-05-27
    always_reset_initial_pose: false
    first_map_only: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 100
    # Milliseconds. 20 ms is too tight on the Pi under DDS/costmap load and
    # causes false BT action/service timeouts during otherwise valid motion.
    default_server_timeout: 1000
    # Use a stable single-plan tree for navigate_to_pose. The Nav2 default tree
    # replans periodically, which caused path churn in the 22:17 bag even when
    # the goal was simple. This tree replans after a real follow/recovery
    # failure or a new goal, while local costmaps still handle nearby obstacles.
    default_nav_to_pose_bt_xml: "/app/navigate_to_pose_stable.xml"
    # 'default_nav_through_poses_bt_xml' uses the Nav2 default:
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    # DWB at 10 Hz with dense trajectory sampling overloaded the Pi and caused
    # stale odom->map transforms. The robot is slow, so 5 Hz is enough and more
    # stable.
    controller_frequency: 5.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Tight turns near the goal may rotate more than translate. Avoid false
      # recovery cycles while the robot is still making slow corrective motion.
      required_movement_radius: 0.04
      movement_time_allowance: 60.0

    # Goal checker parameters
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.45

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      max_angular_accel: 0.55
      rotate_to_goal_heading: false
      simulate_ahead_time: 1.0
      debug_trajectory_details: false
      # Allow cautious reverse trajectories. This gives DWB an escape option
      # when a hard 180-degree in-place turn would stall or disturb localization.
      min_vel_x: -0.06
      min_vel_y: 0.0
      max_vel_x: 0.10
      max_vel_y: 0.0
      max_vel_theta: 0.24
      min_speed_xy: 0.0
      max_speed_xy: 0.10
      # Let DWB sample true straight and very slow in-place rotations; the
      # bridge min_motor_cmd / power assist handles low-speed rotation torque.
      min_speed_theta: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 0.25
      acc_lim_y: 0.0
      acc_lim_theta: 0.55
      decel_lim_x: -0.25
      decel_lim_y: 0.0
      decel_lim_theta: -0.55
      # Fewer samples keep DWB deterministic on the Pi and reduce left/right
      # command churn. vy is unused on this differential-drive robot.
      vx_samples: 18
      vy_samples: 1
      vtheta_samples: 22
      sim_time: 1.2
      linear_granularity: 0.05
      angular_granularity: 0.02
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
        [
          "RotateToGoal",
          "Oscillation",
          "BaseObstacle",
          "GoalAlign",
          "PathAlign",
          "PathDist",
          "GoalDist",
        ]
      BaseObstacle.scale: 0.28
      # The global plan can contain small grid-level kinks. Do not chase its
      # instantaneous heading too hard; look farther ahead and prioritize
      # staying near the path/goal over left-right heading corrections.
      PathAlign.scale: 4.0
      PathAlign.forward_point_distance: 0.45
      GoalAlign.scale: 3.0
      GoalAlign.forward_point_distance: 0.45
      PathDist.scale: 32.0
      GoalDist.scale: 22.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 18.0
      RotateToGoal.lookahead_time: 0.5
      # Oscillation critic: require more committed rotation before declaring
      # oscillation. Default 0.2 rad triggers too early on carpet where traction
      # resistance causes small back-and-forth twitches.
      Oscillation.oscillation_reset_angle: 0.45
      Oscillation.oscillation_reset_dist: 0.05

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 4.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.5
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Include static map obstacles locally so DWB cannot cut through mapped objects.
      footprint: "[[0.16, 0.165], [0.16, -0.165], [-0.11, -0.165], [-0.11, 0.165]]"
      footprint_padding: 0.03
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 8
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.18
        camera_pointcloud:
          topic: /camera/realsense/depth/color/points
          max_obstacle_height: 2.0
          min_obstacle_height: 0.05
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.05
          obstacle_max_range: 2.5
          obstacle_min_range: 0.05
        ai_obstacles:
          topic: /ai_kit/obstacles
          max_obstacle_height: 2.0
          min_obstacle_height: 0.05
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.05
          obstacle_max_range: 2.5
          obstacle_min_range: 0.05
      always_send_full_costmap: false

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      use_sim_time: false
      # Keep enough static-map inflation for safety, but do not make the whole
      # room a high-cost field; the 22:17 bag showed wide global-plan arcs for
      # simple nearby goals.
      footprint: "[[0.16, 0.165], [0.16, -0.165], [-0.11, -0.165], [-0.11, 0.165]]"
      footprint_padding: 0.03
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan ai_obstacles
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.18
        ai_obstacles:
          topic: /ai_kit/obstacles
          max_obstacle_height: 2.0
          min_obstacle_height: 0.05
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.05
          obstacle_max_range: 2.5
          obstacle_min_range: 0.05
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      always_send_full_costmap: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "turtlebot3_world.yaml"

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.25
      # Dijkstra-style NavFn paths are less prone to cell-by-cell zigzags than
      # A* in the current inflated indoor map.
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
      ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.20
    min_rotational_vel: 0.08
    rotational_acc_lim: 0.45

robot_state_publisher:
  ros__parameters:
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 10.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.10, 0.0, 0.24]
    min_velocity: [-0.08, 0.0, -0.24]
    max_accel: [0.25, 0.0, 0.55]
    max_decel: [-0.25, 0.0, -0.55]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.3
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
