DEFAULT_BRANCH: devel
# Keep the repo default as diff-only; the workflow overrides this to full scans
# on push/workflow_dispatch while PRs stay fast.
VALIDATE_ALL_CODEBASE: false
CLEAR_REPORT_FOLDER: true
SHOW_ELAPSED_TIME: true
FLAVOR_SUGGESTIONS: false
PRINT_ALPACA: false
GITHUB_COMMENT_REPORTER: false
MARKDOWN_SUMMARY_REPORTER: true

ENABLE_LINTERS:
  - ACTION_ACTIONLINT
  - BASH_SHELLCHECK
  - BASH_SHFMT
  - DOCKERFILE_HADOLINT
  - JSON_JSONLINT
  - MARKDOWN_MARKDOWNLINT
  - PYTHON_RUFF
  - YAML_YAMLLINT

# Keep correctness/configuration checks blocking, while broader code-quality
# feedback is introduced as warnings first to avoid noisy CI failures.
ENABLE_ERRORS_LINTERS:
  - ACTION_ACTIONLINT
  - YAML_YAMLLINT

EXCLUDED_DIRECTORIES:
  - .git
  - .pytest_cache
  - __pycache__
  - .venv
  - .vscode
  - megalinter-reports

BASH_SHELLCHECK_ARGUMENTS: >-
  --external-sources
  --exclude=SC1091
