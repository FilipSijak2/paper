name: MegaLinter

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: MegaLinter
    runs-on: ubuntu-latest
    env:
      VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
      MEGALINTER_SCOPE_LABEL: ${{ github.event_name == 'pull_request' && 'changed files in the current diff' || 'the entire repository' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run MegaLinter
        uses: oxsecurity/megalinter@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append Parsed MegaLinter Summary
        if: success() || failure()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          from pathlib import Path

          report_file = Path("megalinter-reports/megalinter-report.md")
          config_file = Path(".mega-linter.yml")

          def parse_simple_yaml_lists(path):
              if not path.exists():
                  return {}

              parsed = {}
              active_list = None

              for raw_line in path.read_text(encoding="utf-8", errors="replace").splitlines():
                  line = raw_line.rstrip()
                  stripped = line.strip()

                  if not stripped or stripped.startswith("#"):
                      continue

                  if not line.startswith(" ") and ":" in stripped:
                      key, value = stripped.split(":", 1)
                      key = key.strip()
                      value = value.strip()
                      if value:
                          parsed[key] = value
                          active_list = None
                      else:
                          parsed[key] = []
                          active_list = key
                      continue

                  if active_list and stripped.startswith("- "):
                      parsed[active_list].append(stripped[2:].strip())
                      continue

                  active_list = None

              return parsed

          config = parse_simple_yaml_lists(config_file)
          enabled_linters = config.get("ENABLE_LINTERS", [])
          blocking_linters = config.get("ENABLE_ERRORS_LINTERS", [])
          non_blocking_linters = [
              linter for linter in enabled_linters if linter not in set(blocking_linters)
          ]
          scope_label = os.environ.get("MEGALINTER_SCOPE_LABEL", "configured files")

          print()
          print("## MegaLinter Configuration")
          print()
          print(f"- Validation scope: `{scope_label}`")
          if enabled_linters:
              print(f"- Enabled linters: `{', '.join(enabled_linters)}`")
          if blocking_linters:
              print(f"- Blocking linters: `{', '.join(blocking_linters)}`")
          if non_blocking_linters:
              print(f"- Warning-only linters: `{', '.join(non_blocking_linters)}`")
          print()
          print("## MegaLinter Checks")
          print()

          if not report_file.exists():
              print(f"- :x: MegaLinter summary file not found at `{report_file}`")
              raise SystemExit(0)

          text = report_file.read_text(encoding="utf-8", errors="replace")
          headers = None
          rows = []
          table_seen = False

          def is_separator(cells):
              compact = "".join(cells).replace("-", "").replace(":", "").strip()
              return compact == ""

          for raw_line in text.splitlines():
              line = raw_line.strip()
              if not line.startswith("|"):
                  continue

              cells = [cell.strip() for cell in line.strip("|").split("|")]
              if not cells:
                  continue

              lowered = [cell.lower() for cell in cells]
              if "descriptor" in lowered and "linter" in lowered:
                  headers = lowered
                  table_seen = True
                  continue

              if is_separator(cells):
                  table_seen = True
                  continue

              if headers is None:
                  continue

              row = {}
              for index, header in enumerate(headers):
                  if index < len(cells):
                      row[header] = cells[index]

              descriptor = row.get("descriptor", "").strip()
              linter = row.get("linter", "").strip()
              if not descriptor or not linter:
                  continue

              rows.append(row)

          def pick(row, *names):
              for name in names:
                  value = row.get(name, "").strip()
                  if value:
                      return value
              return "n/a"

          if rows:
              for row in rows:
                  errors = pick(row, "errors")
                  icon = ":x:" if errors.isdigit() and int(errors) > 0 else ":white_check_mark:"
                  descriptor = pick(row, "descriptor")
                  linter = pick(row, "linter")
                  mode = row.get("mode", "").strip()
                  files = pick(row, "files")
                  fixed = pick(row, "fixed")
                  warnings = pick(row, "warnings")
                  elapsed = pick(row, "elapsed time", "elapsed", "elapsed_time")
                  mode_prefix = f"mode={mode}, " if mode else ""

                  print(
                      f"- {icon} `{linter}` ({descriptor}): "
                      f"{mode_prefix}files={files}, errors={errors}, "
                      f"warnings={warnings}, fixed={fixed}, elapsed={elapsed}"
                  )
          elif table_seen:
              print("- :white_check_mark: MegaLinter completed, but no per-linter rows were emitted for this run.")
              print(f"- :information_source: This usually means no matching files required linting within {scope_label}.")
          else:
              print(f"- :warning: Could not parse structured linter rows from `{report_file}`. See MegaLinter artifacts for details.")
          PY
