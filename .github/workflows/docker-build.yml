name: Build and Push Changed Docker Images

on:
  push:
    branches: [ devel ]
  pull_request:
    branches: [ devel ]

permissions:
  contents: read

env:
  REPO_OWNER_LC: ${{ github.repository_owner }}

jobs:
  detect-changes:
    name: Detect changed Docker images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      any_changed: ${{ steps.set-matrix.outputs.any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List changed files
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA='${{ github.event.pull_request.base.sha }}'
            HEAD_SHA='${{ github.event.pull_request.head.sha }}'
          else
            BASE_SHA="$(git rev-parse HEAD^ || echo '')"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi
          echo "BASE_SHA=$BASE_SHA";
          echo "HEAD_SHA=$HEAD_SHA";
          if [ -n "$BASE_SHA" ]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed_files.txt
          else
            git ls-files > changed_files.txt
          fi
          echo "Changed files:"; cat changed_files.txt

      - name: Determine changed images
        id: set-matrix
        run: |
          set -e
          declare -A MAP
          MAP[laser_driver_cont]=driver_cont
          MAP[nav_cont]=nav_cont
          MAP[slam_cont]=slam_cont
          MAP[rosbridge_cont]=rosbridge_cont
          MAP[db_cont]=db_cont

          changed_dirs=()
          while IFS= read -r f; do
            for d in "${!MAP[@]}"; do
              if [[ "$f" == $d/Dockerfile* ]]; then
                changed_dirs+=("$d")
              fi
            done
          done < changed_files.txt

          unique_dirs=($(printf '%s\n' "${changed_dirs[@]}" | sort -u))
          if [ ${#unique_dirs[@]} -eq 0 ]; then
            echo "No Dockerfile changes detected.";
            echo 'matrix={"include":[]}' >> $GITHUB_OUTPUT
            echo 'any_changed=false' >> $GITHUB_OUTPUT
            exit 0
          fi

            json='{"include":['
            first=true
            for dir in "${unique_dirs[@]}"; do
              img="${MAP[$dir]}"
              if [ "$first" = true ]; then
                json+='{"dir":"'$dir'","image":"'$img'"}'
                first=false
              else
                json+=',{"dir":"'$dir'","image":"'$img'"}'
              fi
            done
            json+=']}';
            echo "Matrix JSON: $json"
            echo "matrix=$json" >> $GITHUB_OUTPUT
            echo 'any_changed=true' >> $GITHUB_OUTPUT

  build:
    name: Build & Push (BananaPi)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any_changed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (ARM emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare metadata
        id: meta
        run: |
          set -e
          OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE=${OWNER_LC}/${{ matrix.image }}
          COMMIT=${GITHUB_SHA::7}
          BRANCH=$(echo '${{ github.ref_name }}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          DATE_TAG=$(date -u +%Y%m%d-%H%M%S)
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "commit_tag=$COMMIT" >> $GITHUB_OUTPUT
          echo "branch_tag=$BRANCH" >> $GITHUB_OUTPUT
          echo "date_tag=$DATE_TAG" >> $GITHUB_OUTPUT

      - name: Build (PR - no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.dir }}
          file: ${{ matrix.dir }}/Dockerfile
          platforms: linux/arm64
          push: false
          tags: test/${{ steps.meta.outputs.image }}:pr-${{ steps.meta.outputs.commit_tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Connect to Tailscale (if key)
        if: github.event_name == 'push'
        env:
          TAILSCALE_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -e
          if [ -z "$TAILSCALE_KEY" ]; then
            echo "No Tailscale key provided; skipping tailscale setup.";
            exit 0;
          fi
          echo "Installing Tailscale..."
          curl -fsSL https://tailscale.com/install.sh | sh
          echo "Bringing up Tailscale tunnel..."
          sudo tailscale up --authkey "$TAILSCALE_KEY" --hostname gh-run-${GITHUB_RUN_ID} --accept-routes --ssh --timeout 40s || {
            echo "Tailscale up failed" >&2;
            sudo tailscale status || true
            exit 1
          }
          echo 'Tailscale status:'
          sudo tailscale status || true

      - name: Login to BananaPi registry
        if: github.event_name == 'push'
        env:
          REGISTRY_HOST: ${{ secrets.BANANAPI_REGISTRY_HOST }}
          REGISTRY_USERNAME: ${{ secrets.BANANAPI_REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.BANANAPI_REGISTRY_PASS }}
          INSECURE: ${{ secrets.BANANAPI_REGISTRY_INSECURE }}
        run: |
          set -e
          if [ -z "$REGISTRY_HOST" ]; then echo 'BANANAPI_REGISTRY_HOST missing'; exit 1; fi
          if [ "${INSECURE,,}" = "true" ]; then
            echo "Configuring insecure registry $REGISTRY_HOST"
            if [ -f /etc/docker/daemon.json ]; then
              # Append or merge (simple strategy)
              sudo jq --arg h "$REGISTRY_HOST" '. + {"insecure-registries": ((."insecure-registries" // []) + [$h])}' /etc/docker/daemon.json > tmp.d && sudo mv tmp.d /etc/docker/daemon.json || echo '{"insecure-registries":["'$REGISTRY_HOST'"]}' | sudo tee /etc/docker/daemon.json
            else
              echo '{"insecure-registries":["'$REGISTRY_HOST'"]}' | sudo tee /etc/docker/daemon.json
            fi
            sudo systemctl restart docker || sudo service docker restart || true
            sleep 2
          fi
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Build & Push (BananaPi)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.dir }}
          file: ${{ matrix.dir }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.BANANAPI_REGISTRY_HOST }}/${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.commit_tag }}
            ${{ secrets.BANANAPI_REGISTRY_HOST }}/${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.branch_tag }}
            ${{ secrets.BANANAPI_REGISTRY_HOST }}/${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Discord Notification
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo 'Discord webhook not configured'; exit 0; fi
          STATUS='${{ job.status }}'
          if [ "$STATUS" = 'success' ]; then ICON='✅'; COLOR=3066993; else ICON='❌'; COLOR=15158332; fi
          ACTOR='${{ github.actor }}'
          REF='${{ github.ref_name }}'
          COMMIT_URL='${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}'
          COMMIT_MSG=$(git log -1 --pretty=%s || echo commit)
          COMMIT_TRUNC=$(printf '%s' "$COMMIT_MSG" | head -c 120)
          AVATAR="https://github.com/${ACTOR}.png"
          DEST_REG='${{ secrets.BANANAPI_REGISTRY_HOST }}'
          if [ '${{ github.event_name }}' = 'push' ]; then
            IMAGE_LINES=$(printf '%s/%s:%s\n%s/%s:%s\n%s/%s:latest' "$DEST_REG" '${{ steps.meta.outputs.image }}' '${{ steps.meta.outputs.commit_tag }}' "$DEST_REG" '${{ steps.meta.outputs.image }}' '${{ steps.meta.outputs.branch_tag }}' "$DEST_REG" '${{ steps.meta.outputs.image }}')
          else
            IMAGE_LINES='n/a (PR build)'
          fi
          PUSHED='No'
          [ '${{ github.event_name }}' = 'push' ] && PUSHED='Yes'
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Use jq -n with --arg to safely construct JSON
          PAYLOAD=$(jq -n \
            --arg title "$ICON ${{ matrix.image }} build $STATUS" \
            --arg url "$COMMIT_URL" \
            --arg repo '${{ github.repository }}' \
            --arg cmsg "$COMMIT_TRUNC" \
            --arg actor "$ACTOR" \
            --arg branch "$REF" \
            --arg dir '${{ matrix.dir }}' \
            --arg images "$IMAGE_LINES" \
            --arg ts "$TS" \
            --arg avatar "$AVATAR" \
            --arg pushed "$PUSHED" \
            --arg color "$COLOR" \
            '{embeds:[{title:$title,url:$url,color:($color|tonumber),author:{name:$actor,icon_url:$avatar,url:("https://github.com/"+$actor)},description:$cmsg,fields:[{name:"Repository",value:$repo,inline:true},{name:"Branch",value:$branch,inline:true},{name:"Directory",value:$dir,inline:true},{name:"Pushed Images",value:$images,inline:false},{name:"Push Performed",value:$pushed,inline:true}],timestamp:$ts}]}')

          curl -s -H 'Content-Type: application/json' -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL" || echo 'Discord notify failed'

      - name: Summary
        run: |
          echo '## Build Summary' >> $GITHUB_STEP_SUMMARY
          echo "Image (logical): ${{ steps.meta.outputs.image }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit Tag: ${{ steps.meta.outputs.commit_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "Branch Tag: ${{ steps.meta.outputs.branch_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "Directory: ${{ matrix.dir }}" >> $GITHUB_STEP_SUMMARY
          if [ '${{ github.event_name }}' = 'push' ]; then
            echo "Pushed to: ${{ secrets.BANANAPI_REGISTRY_HOST }}" >> $GITHUB_STEP_SUMMARY
          else
            echo 'PR build – no push' >> $GITHUB_STEP_SUMMARY
          fi

  no-changes:
    name: No Docker changes
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any_changed != 'true'
    steps:
      - run: echo 'No Dockerfile changes detected; skipping builds.'